plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.forma.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.forma.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        resValue "string", "backend_base_url", (project.findProperty("BACKEND_BASE_URL") ?: "https://forma-94vp.onrender.com")

        // Google OAuth (PKCE): GOOGLE_CLIENT_ID opcional em gradle.properties; sem ele o app lê googleClientId de /api/auth/config.
        // O scheme do redirect (reverse client id) precisa estar no manifesto: padrão = client id público do backend.
        def googleClientIdProp = (project.findProperty("GOOGLE_CLIENT_ID") ?: "").toString().trim()
        def googleClientIdForScheme = googleClientIdProp ? googleClientIdProp : "1092895218480-kca5pj9b1g8r50t66phm6ccnupr83p94.apps.googleusercontent.com"
        resValue "string", "google_client_id", googleClientIdProp
        manifestPlaceholders = [googleRedirectScheme: "com.googleusercontent.apps." + googleClientIdForScheme.replace(".apps.googleusercontent.com", "")]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation & Lifecycle Compose
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'

    // Network & JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Health Connect (equivalente ao HealthKit do iOS)
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'

    // Chrome Custom Tabs para o login Google OAuth (equivalente ao ASWebAuthenticationSession)
    implementation 'androidx.browser:browser:1.8.0'

    // Armazenamento seguro de sessão (JWT) – equivalente ao Keychain do iOS
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
