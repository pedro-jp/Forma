server:
  port: ${PORT:8085}
  address: 0.0.0.0
  tomcat:
    max-http-form-post-size: 4MB
    max-swallow-size: 4MB

spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:/etc/secrets/.env[.properties]
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  application:
    name: forma-backend
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:h2:file:./forma_local_db;DB_CLOSE_DELAY=-1}
    username: ${SUPABASE_DB_USER:sa}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: ${SUPABASE_DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 2592000000 # 30 dias em milissegundos
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    key: ${ADMIN_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  apple:
    bundle-id: ${APPLE_BUNDLE_ID:com.joaovitor.Forma}
  auth:
    allow-dev-social-mock: ${APP_ALLOW_DEV_SOCIAL_MOCK:false}
  security:
    encryption-key: ${APP_ENCRYPTION_KEY:}
    allowed-origins: ${APP_ALLOWED_ORIGINS:https://forma-94vp.onrender.com}
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
  migration:
    h2-enabled: ${APP_MIGRATION_H2_ENABLED:false}
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    jwks-url: ${SUPABASE_JWKS_URL:}
  keepalive:
    enabled: ${KEEPALIVE_ENABLED:true}
    public-url: ${RENDER_EXTERNAL_URL:${APP_PUBLIC_URL:}}
    interval-ms: ${KEEPALIVE_INTERVAL_MS:600000}
