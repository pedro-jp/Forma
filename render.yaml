services:
  - type: web
    name: forma-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: APP_ALLOW_H2_FALLBACK
        value: "false"
      - key: APP_ALLOW_DEV_SOCIAL_MOCK
        value: "false"
      - key: APP_MIGRATION_H2_ENABLED
        value: "false"
      - key: APP_ALLOWED_ORIGINS
        value: "https://forma-94vp.onrender.com"
      - key: APPLE_BUNDLE_ID
        value: "com.joaovitor.Forma"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_MS
        value: "600000"
      - key: RENDER_EXTERNAL_URL
        value: "https://forma-94vp.onrender.com"
      - key: SUPABASE_DB_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: Pedro
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_KEY
        generateValue: true
